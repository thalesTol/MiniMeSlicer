name: MiniMe macOS release

# Builds MiniMe Slicer for macOS (one universal app for Apple Silicon and Intel) and attaches it to a GitHub release as a
# .dmg. Runs when a release is published, or by hand (Actions > MiniMe macOS release > Run workflow) for an existing tag.
# The dependencies take hours to build the first time; they are cached afterwards, so later releases take about an hour.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the Mac app to (e.g. v2.8.4.57-minime2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: minime-mac-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  check:
    name: Mac app already attached?
    runs-on: ubuntu-latest
    outputs:
      attached: ${{ steps.look.outputs.attached }}
    steps:
      - name: Look at the release
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # publishing a draft that already has the Mac app (built by hand before) needs no second build
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -q -- '-mac-universal\.dmg$'; then
            echo "attached=true" >> "$GITHUB_OUTPUT"
          else
            echo "attached=false" >> "$GITHUB_OUTPUT"
          fi

  deps:
    name: Mac dependencies
    needs: check
    if: needs.check.outputs.attached != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          lfs: 'true'

      - name: Cache key
        id: key
        run: echo "key=macos-15-universal-minime-deps-${{ hashFiles('deps/**') }}" >> "$GITHUB_OUTPUT"

      - name: Load cached dependencies
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/deps/build
          key: ${{ steps.key.outputs.key }}

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          df -h
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} + || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          df -h

      # the dependencies need CMake 3.x (CMake 4 dropped support for their old minimum versions). Homebrew can no longer
      # install an old CMake (brew extract needs the homebrew/core tap), so it comes from Kitware's own release.
      - name: Install CMake 3.31
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          mkdir -p "$RUNNER_TEMP/cmake" && tar -xzf cmake.tar.gz -C "$RUNNER_TEMP/cmake" --strip-components=1 && rm cmake.tar.gz
          echo "$RUNNER_TEMP/cmake/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build dependencies (universal)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install automake texinfo nasm yasm x264
          # zstd is taken away so that no dependency links Homebrew's copy, but Homebrew's git and curl need it: use the
          # system's git and curl for the downloads instead. It is moved aside rather than uninstalled, so putting it
          # back afterwards needs no download (Homebrew's own curl cannot download without it).
          zkeg="$(brew --cellar)/zstd"
          brew unlink zstd || true
          if [ -d "$zkeg" ]; then mv "$zkeg" "$RUNNER_TEMP/zstd-keg"; fi
          mkdir -p "$RUNNER_TEMP/systools"
          ln -sf /usr/bin/git "$RUNNER_TEMP/systools/git"
          ln -sf /usr/bin/curl "$RUNNER_TEMP/systools/curl"
          export PATH="$RUNNER_TEMP/systools:$PATH"
          git --version
          git ls-remote https://github.com/glennrp/libpng.git v1.6.35 > /dev/null && echo "git over https works"
          cmake --version
          ./BuildMac.sh -d -x -a universal -t 10.15 -1
          for arch in arm64 x86_64; do
            (cd "${{ github.workspace }}/deps/build/${arch}" && \
             find . -mindepth 1 -maxdepth 1 ! -name 'BambuStudio_deps' -exec rm -rf {} +)
          done
          # zstd back, so the cache is saved with the same compression the app job restores it with
          if [ -d "$RUNNER_TEMP/zstd-keg" ]; then mv "$RUNNER_TEMP/zstd-keg" "$zkeg" && brew link zstd; fi
          command -v zstd > /dev/null || HOMEBREW_CURL_PATH=/usr/bin/curl brew install zstd
          zstd --version

  app:
    name: Mac app
    needs: deps
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          lfs: 'true'

      - name: Load cached dependencies
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/deps/build
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Version
        run: |
          raw=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          ver=$(echo "$raw" | awk -F. '{printf "%d.%d.%d.%d", $1, $2, $3, $4}')
          echo "VER=$ver" >> "$GITHUB_ENV"

      # the dependencies need CMake 3.x (CMake 4 dropped support for their old minimum versions). Homebrew can no longer
      # install an old CMake (brew extract needs the homebrew/core tap), so it comes from Kitware's own release.
      - name: Install CMake 3.31
        run: |
          curl -fsSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          mkdir -p "$RUNNER_TEMP/cmake" && tar -xzf cmake.tar.gz -C "$RUNNER_TEMP/cmake" --strip-components=1 && rm cmake.tar.gz
          echo "$RUNNER_TEMP/cmake/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build MiniMe (universal)
        run: |
          brew install automake texinfo
          cmake --version
          ./BuildMac.sh -s -x -a universal -t 10.15 -1

      - name: Package the app
        run: |
          src="build/universal/BambuStudio/BambuStudio.app"
          test -d "$src"
          mkdir -p dmg
          ditto "$src" "dmg/MiniMe Slicer.app"
          ln -s /Applications dmg/Applications
          # an ad-hoc signature: Apple Silicon Macs refuse to start unsigned apps (this is not an Apple Developer ID signature)
          codesign --force --deep --sign - "dmg/MiniMe Slicer.app"
          codesign --verify --deep --strict "dmg/MiniMe Slicer.app"
          name="MiniMeSlicer-${VER}-mac-universal.dmg"
          hdiutil create -volname "MiniMe Slicer" -srcfolder dmg -ov -format UDZO "$name"
          echo "DMG=$name" >> "$GITHUB_ENV"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$DMG" --clobber --repo "${{ github.repository }}"

      - name: Keep the app as a workflow artifact too
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}
          retention-days: 14
